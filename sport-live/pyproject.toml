[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[project]
name = "jev-sport-live"
version = "0.1.0"
description = "Vitrine esportiva que se adapta à intenção do cliente com Jev."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "python-dotenv>=1.1,<2", "uvicorn>=0.34,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
[project.scripts]
sport-live = "sport_live.app:main"
[tool.hatch.build.targets.wheel]
packages = ["src/sport_live"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
