<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Sizer · Jev</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #eef0f4; --border: #dfe3ea;
    --text: #1a1d24; --muted: #6b7280; --accent: #4f46e5; --accent-soft: #e0e7ff;
    --ok: #16a34a; --ok-soft: #dcfce7; --warn: #d97706; --warn-soft: #fef3c7;
    --gray: #6b7280; --gray-soft: #e5e7eb; --danger: #dc2626;
    --pp: #93c5fd; --p: #60a5fa; --m: #6366f1; --g: #a855f7; --gg: #ec4899;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117; --surface: #171a23; --surface-2: #1f2330; --border: #2a2f3d;
      --text: #e6e8ef; --muted: #9aa1b2; --accent: #818cf8; --accent-soft: #2b2f57;
      --ok: #4ade80; --ok-soft: #14352a; --warn: #fbbf24; --warn-soft: #3d2f0d;
      --gray: #9aa1b2; --gray-soft: #2a2f3d; --danger: #f87171;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  header .sub { color: var(--muted); font-size: 13px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
  .chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 24px 80px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  select, button, input { font: inherit; }
  select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); min-width: 260px; }
  label.check { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
  .btn { padding: 9px 16px; border-radius: 8px; border: 1px solid transparent; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; transition: transform .08s, opacity .2s; }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn.ghost { background: transparent; color: var(--accent); border-color: var(--accent); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .meters { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .meter { background: var(--surface-2); border-radius: 8px; padding: 6px 12px; min-width: 96px; }
  .meter .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .meter .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .summary { display: none; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; margin-top: 14px; }
  .summary.show { display: grid; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
  .panel h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .hist { display: flex; gap: 10px; align-items: flex-end; height: 92px; }
  .hist .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; position: relative; cursor: default; }
  .hist .col:hover .hbar { filter: brightness(1.12); }
  .hist .tip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(4px); min-width: 190px; padding: 8px 10px; border-radius: 8px; background: var(--text); color: var(--bg); font-size: 12px; line-height: 1.4; text-align: left; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 4; }
  .hist .tip::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -5px; border: 5px solid transparent; border-top-color: var(--text); }
  .hist .tip b { font-size: 13px; }
  .hist .tip small { display: block; color: var(--bg); opacity: .75; }
  .hist .col:hover .tip { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hist .hbar { width: 100%; border-radius: 6px 6px 2px 2px; min-height: 2px; transition: height .5s cubic-bezier(.2,.8,.2,1); }
  .hist .lbl { font-size: 12px; font-weight: 700; }
  .hist .n { font-size: 11px; color: var(--muted); }
  .kv { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed var(--border); }
  .kv:last-child { border-bottom: 0; }
  .kv b { font-variant-numeric: tabular-nums; }
  .big { font-size: 28px; font-weight: 700; line-height: 1; }
  .big small { font-size: 13px; color: var(--muted); font-weight: 500; }

  .list { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: minmax(240px, 1.1fr) minmax(300px, 1.5fr) minmax(270px, 1fr); gap: 18px; align-items: center; cursor: pointer; opacity: 0; transform: translateY(6px); animation: in .35s forwards; }
  @keyframes in { to { opacity: 1; transform: none; } }
  .card:hover { border-color: var(--accent); }
  .card.done { opacity: 1; transform: none; animation: flip .5s cubic-bezier(.2,.8,.2,1); }
  @keyframes flip { 0% { transform: perspective(900px) rotateX(-8deg); opacity: .5; } 100% { transform: none; opacity: 1; } }
  .card .head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .card .id { color: var(--muted); font-size: 12px; text-decoration: none; font-variant-numeric: tabular-nums; }
  .card .id:hover { color: var(--accent); }
  .card .title { font-weight: 600; line-height: 1.35; }
  .card .who { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .stream-A { background: #dbeafe; color: #1d4ed8; } .stream-B { background: #dcfce7; color: #15803d; }
  .stream-C { background: #fef3c7; color: #b45309; } .stream-D { background: #fce7f3; color: #be185d; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stream-A { background:#1e3a5f; color:#93c5fd } :root:not([data-theme="light"]) .stream-B { background:#14352a; color:#86efac } :root:not([data-theme="light"]) .stream-C { background:#3d2f0d; color:#fcd34d } :root:not([data-theme="light"]) .stream-D { background:#4a1d3a; color:#f9a8d4 } }

  .dist { display: flex; flex-direction: column; gap: 8px; }
  .dist .verdict { display: flex; align-items: center; gap: 10px; }
  .size-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 46px; height: 38px; padding: 0 10px; border-radius: 10px; font-size: 20px; font-weight: 800; letter-spacing: .02em; color: #fff; }
  .size-PP { background: var(--pp); color: #1e3a8a; } .size-P { background: var(--p); color: #fff; } .size-M { background: var(--m); } .size-G { background: var(--g); } .size-GG { background: var(--gg); }
  .conf { font-size: 12px; color: var(--muted); }
  .conf b { color: var(--text); }
  .band { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .band-firm { background: var(--ok-soft); color: var(--ok); }
  .band-tentative { background: var(--warn-soft); color: var(--warn); }
  .band-review { background: var(--gray-soft); color: var(--gray); }
  .bar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
  .bar span { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; transition: width .6s cubic-bezier(.2,.8,.2,1); width: 0; overflow: hidden; white-space: nowrap; }
  .bar .s-PP { background: var(--pp); color: #1e3a8a; } .bar .s-P { background: var(--p); } .bar .s-M { background: var(--m); } .bar .s-G { background: var(--g); } .bar .s-GG { background: var(--gg); }
  .legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .pending { color: var(--muted); font-size: 12px; display: flex; gap: 10px; align-items: center; }
  .pending .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .2; } }

  .factors { display: flex; flex-direction: column; gap: 6px; }
  .factor { display: grid; grid-template-columns: 96px 1fr 28px; gap: 8px; align-items: center; font-size: 12px; }
  .factor > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .factor .track { height: 6px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .factor .fill { height: 100%; background: var(--accent); width: 0; transition: width .6s; border-radius: 4px; }
  .factor .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .flags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .flag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
  .flag.err { background: #fee2e2; color: var(--danger); }
  .actions { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .actions select { min-width: 64px; padding: 4px 6px; }
  .actions .btn { white-space: nowrap; }
  .usage { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  .error { background: #fee2e2; color: #991b1b; padding: 10px 14px; border-radius: 8px; margin-top: 12px; }

  .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(560px, 100vw); background: var(--surface); border-left: 1px solid var(--border); box-shadow: -8px 0 24px rgba(0,0,0,.15); transform: translateX(100%); transition: transform .25s; z-index: 10; display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .drawer .dh { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .drawer .dh h2 { font-size: 15px; margin: 0; flex: 1; }
  .drawer .db { overflow: auto; padding: 16px 18px; }
  .drawer h4 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .drawer h4:first-child { margin-top: 0; }
  pre { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: 12px; overflow: auto; white-space: pre-wrap; word-break: break-word; max-height: 260px; margin: 0; }
  .x { background: none; border: 0; font-size: 20px; cursor: pointer; color: var(--muted); }
  .probs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .probs div { text-align: center; padding: 8px 4px; border-radius: 8px; background: var(--surface-2); }
  .probs b { display: block; font-size: 16px; }
  .probs small { color: var(--muted); }
  @media (max-width: 860px) { .card { grid-template-columns: 1fr; } .summary { grid-template-columns: 1fr; } .meters { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>Story Sizer</h1>
  <span class="sub">sugestão de tamanho de User Stories com Jev</span>
  <span class="chip accent" id="model">…</span>
  <span class="chip" id="team">…</span>
</header>
<main>
  <div class="toolbar">
    <select id="sprint"><option>Carregando sprints…</option></select>
    <label class="check"><input type="checkbox" id="all"> incluir já dimensionadas</label>
    <button class="btn" id="run" disabled>Classificar com Jev</button>
    <div class="meters">
      <div class="meter"><div class="v" id="m-count">–</div><div class="k">stories</div></div>
      <div class="meter"><div class="v" id="m-tokens">–</div><div class="k">tokens</div></div>
      <div class="meter"><div class="v" id="m-cost">–</div><div class="k">custo USD</div></div>
      <div class="meter"><div class="v" id="m-time">–</div><div class="k">tempo total</div></div>
      <div class="meter"><div class="v" id="m-avg">–</div><div class="k">média / story</div></div>
    </div>
  </div>
  <div class="summary" id="summary">
    <div class="panel"><h3>Distribuição sugerida</h3><div class="hist" id="hist"></div></div>
    <div class="panel"><h3>Esforço estimado</h3><div class="big" id="days">–</div><div class="kv"><span>Firmes</span><b id="c-firm">0</b></div><div class="kv"><span>Com alternativa</span><b id="c-tent">0</b></div><div class="kv"><span>Precisam de humano</span><b id="c-rev">0</b></div></div>
    <div class="panel"><h3>Alertas</h3><div id="alerts"></div></div>
  </div>
  <div id="error" class="error" style="display:none"></div>
  <div class="list" id="list"><div class="empty">Escolha uma sprint para carregar as stories.</div></div>
</main>

<div class="drawer" id="drawer">
  <div class="dh"><h2 id="d-title">…</h2><button class="x" id="d-close" aria-label="Fechar">×</button></div>
  <div class="db" id="d-body"></div>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const state = { cfg: null, stories: [], results: {}, running: false };
const fmtUSD = v => v == null ? '–' : (v < 0.01 ? '$' + v.toFixed(5) : '$' + v.toFixed(3));
const fmtMs = ms => ms < 1000 ? Math.round(ms) + ' ms' : (ms / 1000).toFixed(1) + ' s';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
  return r;
}
function showError(msg) { const e = $('#error'); e.style.display = msg ? '' : 'none'; e.textContent = msg || ''; }

async function init() {
  try {
    state.cfg = await (await api('/api/config')).json();
    $('#model').textContent = state.cfg.model;
    $('#team').textContent = `${state.cfg.project} · ${state.cfg.team}`;
    const its = await (await api('/api/sprints')).json();
    const sel = $('#sprint');
    sel.innerHTML = its.map(i => `<option value="${esc(i.path)}" ${i.timeframe === 'current' ? 'selected' : ''}>${esc(i.name)} · ${(i.start || '').slice(0, 10)} → ${(i.finish || '').slice(0, 10)}${i.timeframe === 'current' ? ' (atual)' : ''}</option>`).join('');
    sel.onchange = loadStories; $('#all').onchange = loadStories;
    $('#run').onclick = run;
    $('#d-close').onclick = () => $('#drawer').classList.remove('open');
    document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#drawer').classList.remove('open'); });
    await loadStories();
  } catch (e) { showError(e.message); }
}

async function loadStories() {
  showError(null);
  state.results = {}; $('#summary').classList.remove('show');
  ['m-tokens', 'm-cost', 'm-time', 'm-avg'].forEach(id => $('#' + id).textContent = '–');
  $('#list').innerHTML = '<div class="empty">Carregando stories do Azure DevOps…</div>';
  $('#run').disabled = true;
  try {
    const data = await (await api(`/api/stories?sprint=${encodeURIComponent($('#sprint').value)}&all=${$('#all').checked}`)).json();
    state.stories = data.stories;
    $('#m-count').textContent = state.stories.length;
    render();
    $('#run').disabled = state.stories.length === 0;
  } catch (e) { showError(e.message); $('#list').innerHTML = ''; }
}

// Tamanho implícito na estimativa das tasks, pela mesma tabela da validação.
function teamSize(id) {
  const s = state.stories.find(x => x.id === id), v = state.cfg.validation;
  if (!s || !s.tasks_estimate_hours || !v) return '';
  const days = s.tasks_estimate_hours / v.hours_per_day;
  const k = state.cfg.order.find(k => v.upper_days[k] != null && days <= v.upper_days[k]) || state.cfg.order.at(-1);
  return ` · <span title="pela estimativa das tasks (${s.tasks_estimate_hours} h)">time: <b>${k}</b></span>`;
}
function streamClass(s) { const m = /Stream\s+(\w)/i.exec(s || ''); return m ? 'stream-' + m[1].toUpperCase() : ''; }

function render() {
  const list = $('#list');
  if (!state.stories.length) { list.innerHTML = '<div class="empty">Nenhuma story sem tamanho nesta sprint.</div>'; return; }
  list.innerHTML = state.stories.map((s, i) => `
    <div class="card" id="card-${s.id}" style="animation-delay:${Math.min(i * 40, 600)}ms" onclick="openDrawer(${s.id})">
      <div>
        <div class="head">
          <a class="id" href="${esc(s.url)}" target="_blank" onclick="event.stopPropagation()">#${s.id}</a>
          ${s.stream ? `<span class="chip ${streamClass(s.stream)}">${esc(s.stream)}</span>` : ''}
          <span class="chip">${esc(s.state)}</span>
          ${s.size ? `<span class="chip">atual: ${esc(s.size)}</span>` : ''}
        </div>
        <div class="title">${esc(s.short_title)}</div>
        <div class="who">${esc(s.assigned_to || 'sem responsável')} · descrição ${s.description_chars} ch · AC ${s.acceptance_chars} ch · ~${s.estimated_tokens} tokens</div>
        <div class="who">${s.tasks ? `${s.tasks} tasks · time estimou <b>${s.tasks_estimate_hours} h</b>${s.tasks_completed_hours ? ` · apontadas ${s.tasks_completed_hours} h` : ''}` : 'sem tasks — só o texto para dimensionar'}</div>
      </div>
      <div class="dist" id="dist-${s.id}">
        <div class="pending">${s.has_acceptance ? 'aguardando classificação' : '<span class="flag">sem critérios de aceite</span> aguardando classificação'}</div>
        <div class="bar">${state.cfg.order.map(k => `<span class="s-${k}"></span>`).join('')}</div>
        <div class="legend">${state.cfg.order.map(k => `<span>${k}</span>`).join('')}</div>
      </div>
      <div class="factors" id="fac-${s.id}"></div>
    </div>`).join('');
}

async function run() {
  if (state.running) return;
  state.running = true; showError(null);
  const btn = $('#run'); btn.disabled = true; btn.textContent = 'Classificando…';
  state.results = {};
  state.stories.forEach(s => {
    $(`#dist-${s.id} .pending`).innerHTML = '<span class="dot"></span> Jev avaliando…';
    $(`#fac-${s.id}`).innerHTML = '';
  });
  const t0 = performance.now();
  let tokens = 0, cost = 0, done = 0, sumMs = 0;
  try {
    const r = await api('/api/size', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: state.stories.map(s => s.id) }) });
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done: end } = await reader.read();
      if (end) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if (!line) continue;
        const res = JSON.parse(line);
        state.results[res.id] = res; done++;
        if (!res.error) { tokens += res.usage.input_tokens || 0; cost += res.usage.cost_usd || 0; sumMs += res.usage.elapsed_ms || 0; }
        paint(res);
        $('#m-tokens').textContent = tokens.toLocaleString('pt-BR');
        $('#m-cost').textContent = fmtUSD(cost);
        $('#m-time').textContent = fmtMs(performance.now() - t0);
        $('#m-avg').textContent = fmtMs(sumMs / Math.max(done, 1));
        summary();
      }
    }
  } catch (e) { showError(e.message); }
  $('#m-time').textContent = fmtMs(performance.now() - t0);
  btn.disabled = false; btn.textContent = 'Classificar de novo'; state.running = false;
}

function paint(res) {
  const card = $(`#card-${res.id}`); if (!card) return;
  const dist = $(`#dist-${res.id}`), fac = $(`#fac-${res.id}`);
  card.classList.remove('done'); void card.offsetWidth; card.classList.add('done');
  if (res.error) {
    dist.querySelector('.pending').innerHTML = `<span class="flag err">${esc(res.error)}</span>`;
    return;
  }
  const cfg = state.cfg, u = res.usage;
  const bandLabel = { firm: 'sugestão firme', tentative: `alternativa: ${res.second}`, review: 'precisa de humano' }[res.band];
  dist.querySelector('.pending').outerHTML = `
    <div class="verdict">
      <span class="size-badge size-${res.suggested}">${res.suggested}</span>
      <div>
        <div class="conf">confiança <b>${(res.confidence * 100).toFixed(0)}%</b> · ${esc(cfg.sizes[res.suggested].effort)} · ≈${res.expected_days} d${teamSize(res.id)}</div>
        <span class="band band-${res.band}">${bandLabel}</span>
      </div>
    </div>`;
  const bar = dist.querySelector('.bar');
  requestAnimationFrame(() => cfg.order.forEach(k => {
    const p = res.probabilities[k], el = bar.querySelector('.s-' + k);
    el.style.width = (p * 100) + '%'; el.textContent = p >= 0.12 ? `${k} ${(p * 100).toFixed(0)}%` : '';
    el.title = `${k}: ${(p * 100).toFixed(1)}%`;
  }));
  fac.innerHTML = Object.entries(res.factors).map(([k, f]) => `
    <div class="factor" title="${esc(f.level)}"><span>${esc(f.label)}</span><div class="track"><div class="fill" data-w="${f.score / f.max * 100}"></div></div><span class="n">${f.score.toFixed(1)}</span></div>`).join('')
    + `<div class="flags">${Object.values(res.flags).filter(f => f.raised).map(f => `<span class="flag">${esc(f.label)} ${(f.probability * 100).toFixed(0)}%</span>`).join('')}${res.input.truncated ? '<span class="flag">descrição truncada</span>' : ''}</div>`
    + `<div class="actions" onclick="event.stopPropagation()">
        <select id="pick-${res.id}">${cfg.order.map(k => `<option ${k === res.suggested ? 'selected' : ''}>${k}</option>`).join('')}</select>
        <button class="btn small ${cfg.allow_write ? '' : 'ghost'}" onclick="applySize(${res.id})" title="${cfg.allow_write ? 'Grava ' + cfg.field + ' no ADO' : 'Escrita desligada (ALLOW_WRITE=false)'}">Aplicar no ADO</button>
        <span class="usage">${u.input_tokens} tok · ${fmtUSD(u.cost_usd)} · ${u.elapsed_ms} ms</span>
      </div>`;
  requestAnimationFrame(() => fac.querySelectorAll('.fill').forEach(el => el.style.width = el.dataset.w + '%'));
}

function summary() {
  const cfg = state.cfg, rs = Object.values(state.results).filter(r => !r.error);
  if (!rs.length) return;
  $('#summary').classList.add('show');
  const counts = Object.fromEntries(cfg.order.map(k => [k, 0]));
  let days = 0; const bands = { firm: 0, tentative: 0, review: 0 }; const alerts = {};
  rs.forEach(r => { counts[r.suggested]++; days += r.expected_days; bands[r.band]++;
    Object.values(r.flags).forEach(f => { if (f.raised) alerts[f.label] = (alerts[f.label] || 0) + 1; }); });
  const max = Math.max(...Object.values(counts), 1);
  $('#hist').innerHTML = cfg.order.map(k => {
    const sz = cfg.sizes[k], n = counts[k];
    const tip = `<div class="tip"><b>${k} · ${esc(sz.label)}</b><small>${esc(sz.effort)} · ≈${sz.days} dias-pessoa</small><small>${n} ${n === 1 ? 'story sugerida' : 'stories sugeridas'} · ${(n * sz.days).toFixed(1)} dias no total</small></div>`;
    return `<div class="col">${tip}<span class="n">${n}</span><div class="hbar size-${k}" style="height:${n / max * 64 + 2}px"></div><span class="lbl">${k}</span></div>`;
  }).join('');
  $('#days').innerHTML = `${days.toFixed(1)} <small>dias-pessoa em ${rs.length} stories</small>`;
  $('#c-firm').textContent = bands.firm; $('#c-tent').textContent = bands.tentative; $('#c-rev').textContent = bands.review;
  const a = Object.entries(alerts);
  $('#alerts').innerHTML = a.length ? a.map(([k, n]) => `<div class="kv"><span>${esc(k)}</span><b>${n}</b></div>`).join('') : '<span class="conf">Nenhum alerta levantado.</span>';
}

async function applySize(id) {
  const size = $(`#pick-${id}`).value;
  if (!state.cfg.allow_write) { alert('Escrita no ADO está desligada. Defina ALLOW_WRITE=true no .env para gravar ' + state.cfg.field + '.'); return; }
  if (!confirm(`Gravar ${state.cfg.field} = ${size} na story #${id}?`)) return;
  try { await api('/api/apply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, size }) });
    const card = $(`#card-${id}`); card.querySelector('.head').insertAdjacentHTML('beforeend', `<span class="chip" style="background:var(--ok-soft);color:var(--ok)">gravado: ${size}</span>`);
  } catch (e) { alert(e.message); }
}

function openDrawer(id) {
  const s = state.stories.find(x => x.id === id), r = state.results[id];
  $('#d-title').textContent = `#${id} · ${s.short_title}`;
  let html = '';
  if (r && !r.error) {
    html += `<h4>Como o Jev decidiu</h4><div class="probs">${state.cfg.order.map(k => `<div><b>${(r.probabilities[k] * 100).toFixed(1)}%</b><small>${k}</small></div>`).join('')}</div>
      <p class="conf">Confiança ${(r.confidence * 100).toFixed(1)}% (derivada da concentração da distribuição). Esforço esperado ponderado: ${r.expected_days} dias. Modelo ${esc(r.model)}.</p>
      <h4>Fatores (Score)</h4>${Object.values(r.factors).map(f => `<div class="kv"><span>${esc(f.label)} — <i>${esc(f.level)}</i></span><b>${f.score.toFixed(2)} / ${f.max}</b></div>`).join('')}
      <h4>Alertas (Noul)</h4>${Object.values(r.flags).map(f => `<div class="kv"><span>${esc(f.label)}</span><b>${(f.probability * 100).toFixed(1)}%</b></div>`).join('')}
      <h4>Consumo</h4><div class="kv"><span>Tokens de entrada</span><b>${r.usage.input_tokens}</b></div><div class="kv"><span>Custo</span><b>${fmtUSD(r.usage.cost_usd)}</b></div><div class="kv"><span>Latência</span><b>${r.usage.elapsed_ms} ms</b></div>`;
  } else {
    html += `<p class="conf">${r ? esc(r.error) : 'Ainda não classificada.'}</p>`;
  }
  const sent = r ? r.state_sent : null;
  if (sent) {
    html += `<h4>Texto enviado ao Jev</h4><pre>${esc(sent.title)}\nStream: ${esc(sent.stream || '—')} · Estado: ${esc(sent.state)}\n\n[Descrição]\n${esc(sent.description)}\n\n[Critérios de aceite]\n${esc(sent.acceptance_criteria)}</pre>`;
  } else {
    html += `<p class="conf">Descrição ${s.description_chars} caracteres · Critérios de aceite ${s.acceptance_chars} caracteres.</p>`;
  }
  $('#d-body').innerHTML = html;
  $('#drawer').classList.add('open');
}

init();
</script>
</body>
</html>
