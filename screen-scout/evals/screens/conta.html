<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Minha conta · Aurora Cloud</title></head>
<body>
<header><a href="/painel">Painel</a> <a href="/ajuda">Ajuda</a> <button type="button">Sair</button></header>
<main>
  <h1>Minha conta</h1>
  <section aria-labelledby="perfil">
    <h2 id="perfil">Perfil</h2>
    <div><label for="apelido">Nome de exibição</label><input id="apelido" required></div>
    <div><label for="rec">E-mail de recuperação</label><input id="rec" placeholder="voce@exemplo.com"></div>
    <div><label for="sms">Número para SMS</label><input id="sms" placeholder="+55 (00) 00000-0000"></div>
    <div><label for="nasc">Aniversário</label><input id="nasc" type="date"></div>
    <div><label for="idioma">Idioma</label>
      <select id="idioma"><option>Português</option><option>English</option></select></div>
    <div><label><input type="checkbox" checked> Receber novidades por e-mail</label></div>
  </section>
  <button type="button">Salvar alterações</button>
  <button type="button">Alterar senha</button>
  <button type="button">Baixar meus dados</button>
  <button type="button">Encerrar conta</button>
</main>
</body></html>
