[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jev-skill-validator"
version = "0.1.0"
description = "Validação estrutural e semântica de Agent Skills com Jev."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6.0.2,<7",
  "rich>=14,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
skill-validator = "skill_validator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
